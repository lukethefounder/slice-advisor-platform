[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "slice-intelligence-service"
version = "0.1.0"
description = "Restricted CAMEL-AI workforce service for Slice market intelligence."
requires-python = ">=3.11,<3.14"
dependencies = [
  "camel-ai==0.2.91a4",
  "fastapi==0.116.1",
  "pydantic==2.12.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
